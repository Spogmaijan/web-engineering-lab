<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Website</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <h1>Welcome to My Website</h1>

    <nav aria-label="Main navigation">
      <a href="#home" class="nav-link" aria-current="page">Home</a>
      <a href="#about" class="nav-link">About</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
  </header>

  <main id="main-content">

    <section id="home">
      <h2>Home</h2>
      <p class="text-muted">
        Welcome to my website. This page is simple and accessible.
      </p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p class="text-muted">
        This section contains information about the website.
      </p>
    </section>

    <section id="contact">
      <h2>Contact</h2>

      <form>

        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          autocomplete="name"
          required
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >

        <fieldset>
          <legend>Preferred contact method</legend>

          <label>
            <input
              type="radio"
              name="contact-method"
              value="email"
            >
            Email
          </label>

          <label>
            <input
              type="radio"
              name="contact-method"
              value="phone"
            >
            Phone
          </label>
        </fieldset>

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="5"
        ></textarea>

        <button type="submit">Submit</button>

      </form>

    </section>

  </main>

</body>
</html>
